
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile-localserver
    ports:
      - "33311:33311"
    networks:
      - geenii-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - .geenii:/.geenii
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - REDIS_URI=redis://redis:6379/0

#  ui:
#    build:
#      context: ./ui
#      dockerfile: Dockerfile-localserver
#    ports:
#      - "33380:80"
#    networks:
#      - geenii-net

  redis:
    image: redis:8.4
    ports:
      - "33379:6379"
    #expose:
    #  - "6379"
    networks:
      - geenii-net
    volumes:
      #- redis-data:/data
      - ./volumes/redis:/data
    profiles:
      - advanced

  mongodb:
    image: mongo:8.2
    ports:
      - "33317:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?Variable not set}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Variable not set}
      - MONGO_INITDB_ROOT_AUTHENTICATION_DATABASE=${MONGO_INITDB_ROOT_AUTHENTICATION_DATABASE:-admin}
    networks:
      - geenii-net
    volumes:
      #- mongo-data:/data/db
      - ./volumes/mongodb:/data/db
    profiles:
      - advanced


  #  ollama:
  #    image: ollama/ollama:latest
  #    volumes:
  #      #- ./data/ollama:/root/.ollama
  #      - ~/.ollama:/root/.ollama
  #    ports:
  #      - "11434:11434" # ollama api


