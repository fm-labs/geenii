name: Release Python SDK

on:
  push:
    tags: ["python-v*"]

# Actions are pinned to commit SHAs (updated by Dependabot).
permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Compare tag with pyproject.toml version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          if [[ "${TAG}" != "python-v${version}" ]]; then
            echo "::error::Tag ${TAG} does not match the package version ${version} in pyproject.toml (expected v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-releases (e.g. 1.0.0a1, 1.0.0b2, 1.0.0rc1, 1.0.0.dev1)
          if [[ "${version}" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  #  ci:
  #    name: CI
  #    needs: check-version
  #    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # never build release artifacts from a cache
          python-version: '3.14'
      - name: Build sdist and wheel
        run: uv build --no-sources
      - name: Check wheel
        run: |
          # -I keeps the current directory off sys.path
          # --isolated uses a fresh environment, with nothing reused from a previous run.
          uv run --isolated --no-project --with dist/*.whl \
            python -I -c "import geenii, importlib.metadata as m; print(m.version('geenii'))"
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create release with distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
          TITLE: "Geenii Python SDK"
        run: |
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE} ${TAG}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

  # A dry run on TestPyPI; if the upload or the install check fails, nothing is published to PyPI.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-version, build]
    runs-on: ubuntu-latest
    # Trusted publishing, like PyPI below, but configured on test.pypi.org.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/geenii/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI rejects re-uploads, so re-running a release whose PyPI step failed would fail here.
          skip-existing: true
#      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
#        with:
#          enable-cache: false
#          python-version: "3.14"
#      - name: Install from TestPyPI
#        env:
#          VERSION: ${{ needs.check-version.outputs.version }}
#        # Only TestPyPI is used as the index, which works because the package has no
#        # required dependencies. New uploads can take a minute to appear, so retry.
#        run: |
#          for i in 1 2 3; do
#            uv run --no-project --refresh \
#              --index https://test.pypi.org/simple/ \
#              --index-strategy unsafe-best-match \
#              --with "geenii==${VERSION}" \
#              python -c "import geenii; print(geenii.__version__)" && exit 0
#            echo "Not available yet, retrying..."; sleep 20
#          done
#          exit 1

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geenii/${{ needs.check-version.outputs.version }}/
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
