name: Publish image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.ref_name }}
  REPO_NAME: ${{ vars.DOCKERHUB_REPONAME }}
  REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64

    runs-on: ${{ matrix.runner }}
    environment: production

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}-${{ matrix.arch_tag }}
            ${{ env.REGISTRY }}/${{ env.REPO_NAME }}:latest-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.arch_tag }}

  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          set -eux

          docker buildx imagetools create \
            -t $REGISTRY/$REPO_NAME:$IMAGE_TAG \
            -t $REGISTRY/$REPO_NAME:latest \
            $REGISTRY/$REPO_NAME:$IMAGE_TAG-amd64 \
            $REGISTRY/$REPO_NAME:$IMAGE_TAG-arm64

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect $REGISTRY/$REPO_NAME:$IMAGE_TAG