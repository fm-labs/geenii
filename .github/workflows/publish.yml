name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

#env:
#  TAG_NAME: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: linux-arm64
          - platform: darwin/amd64
            runner: macos-latest
            arch_tag: darwin-amd64
          - platform: darwin/arm64
            runner: macos-latest
            arch_tag: darwin-arm64

    runs-on: ${{ matrix.runner }}
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Build binaries
        run: |
          ./build_bin.sh
          cp README.md LICENSE dist/
          TARBALL="geenii-${{ matrix.arch_tag }}.tar.gz"
          tar -czvf "$TARBALL" -C dist .
          if command -v sha256sum &>/dev/null; then
            sha256sum "$TARBALL" > "$TARBALL.sha256"
          else
            shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: geenii-${{ matrix.arch_tag }}
          path: |
            geenii-${{ matrix.arch_tag }}.tar.gz
            geenii-${{ matrix.arch_tag }}.tar.gz.sha256
