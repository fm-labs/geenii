[project]
name = "geenii"
version = "0.4.0"
description = "A versatile AI agent toolkit"
requires-python = ">=3.14,<4.0"
authors = [
    { name = "fm-labs", email = "code@fmlabs.dev" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = [
    "LICEN[CS]E*",
]
dependencies = [
    "anthropic>=1.15.0",
    "click>=8.3.1",
    "croniter>=6.0.0",
    "cryptography>=49.0.0",
    "fastapi>=0.146.0",
    "fastmcp>=4.1.0",
    "httpx>=0.28.0",
    "mcp>=2.3.0",
    "ollama>=0.5.1",
    "openai>=3.35.0",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pymongo>=4.17.0",
    "pyyaml>=6.0",
    "redis>=7.4.0",
    "rich>=14.3.3",
    "tomli-w>=1.2.0",
    "zttp>=0.0.34",
]

[project.urls]
Homepage = "https://github.com/fm-labs/geenii"
Issues = "https://github.com/fm-labs/geenii/issues"

[project.scripts]
geenii = "geenii.cli.main:main"
geenii-scheduler = "geenii.scheduler:main"
geenii-daemon = "geenii.daemon.server:main"

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pyinstaller>=6.17.0",
    "pytest>=9.0.2",
    "ruff>=0.15.21",
    "testcontainers>=4.13.3",
]

[build-system]
requires = [
    "hatchling >= 1.26",
]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/geenii",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
ignore = [
    "BLE001",
    "E402",
    "E501",
    "PERF402",
    "TRY401",
]
select = [
    "E",
]
