[project]
name = "geenii"
version = "0.3.1"
description = "A versatile AI agent toolkit"
requires-python = ">=3.13,<4.0"
authors = [
  { name="fm-labs", email="code@fmlabs.dev" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "anthropic>=0.59.0",
    "click>=8.3.1",
    "croniter>=6.0.0",
    "fastmcp>=2.10.6",
    "httpx>=0.28.0",
    "ollama>=0.5.1",
    "openai>=2.21.0",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pymongo>=4.17.0",
    "redis>=7.4.0",
    "rich>=14.3.3",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
    "pytest>=9.0.2",
    "ruff>=0.15.21",
    "testcontainers>=4.13.3",
]

[project.urls]
Homepage = "https://github.com/fm-labs/geenii"
Issues = "https://github.com/fm-labs/geenii/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true



[tool.hatch.build.targets.wheel]
packages = ["src/geenii"]

[project.scripts]
geenii = "geenii.cli.main:main"
geenii-scheduler = "geenii.scheduler:main"
