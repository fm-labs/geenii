name: Publish image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

env:
  IMAGE_TAG: ${{ github.ref_name }}
  REPO_NAME: ${{ vars.DOCKERHUB_REPONAME }}
  DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        run: |
          set -eu
          : "${REPO_NAME:?DOCKERHUB_REPONAME variable is not set}"
          : "${DOCKER_NAMESPACE:?DOCKERHUB_USERNAME secret is not set}"
          : "${IMAGE_TAG:?github.ref_name is empty}"
        env:
          REPO_NAME: ${{ vars.DOCKERHUB_REPONAME }}
          DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_name }}

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64

    runs-on: ${{ matrix.runner }}
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.arch_tag }}

  manifest:
    name: Create multi-arch manifest
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          set -eux

          docker buildx imagetools create \
            -t $DOCKER_NAMESPACE/$REPO_NAME:$IMAGE_TAG \
            -t $DOCKER_NAMESPACE/$REPO_NAME:latest \
            $DOCKER_NAMESPACE/$REPO_NAME:$IMAGE_TAG-amd64 \
            $DOCKER_NAMESPACE/$REPO_NAME:$IMAGE_TAG-arm64

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect $DOCKER_NAMESPACE/$REPO_NAME:$IMAGE_TAG

  smoke-test:
    name: Smoke test
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run image
        run: |
          set -eux
          docker run --rm $DOCKER_NAMESPACE/$REPO_NAME:$IMAGE_TAG --version